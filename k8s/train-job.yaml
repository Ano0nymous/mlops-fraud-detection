apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-training-job-__RUN_ID__
  namespace: mlops
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: mlflow-sa   # already has S3 access via IRSA
      restartPolicy: Never
      containers:
      - name: trainer
        image: 471932414173.dkr.ecr.ap-south-1.amazonaws.com/fraud-train:__IMAGE_TAG__
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: AWS_DEFAULT_REGION
          value: "ap-south-1"
        - name: MIN_F1_THRESHOLD
          value: "0.85"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"