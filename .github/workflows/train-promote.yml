name: Train & Promote Model

# Deliberately NOT triggered on every push - retraining is a different,
# heavier-weight operation than shipping an API change. Run it on demand
# or on a cadence you choose.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC - adjust to your retraining cadence

env:
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  TRAIN_IMAGE: fraud-train
  EKS_CLUSTER: fraud-cluster
  NAMESPACE: mlops

jobs:
  build-train-image:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.train
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.TRAIN_IMAGE }}:${{ steps.tag.outputs.tag }}

  run-training-job:
    runs-on: ubuntu-latest
    needs: build-train-image
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ secrets.AWS_REGION }}
      - name: Apply a uniquely-named training Job
        run: |
          sed -e "s/__RUN_ID__/${{ github.run_id }}/" \
              -e "s/__IMAGE_TAG__/${{ needs.build-train-image.outputs.image_tag }}/" \
              k8s/train-job.yaml > /tmp/train-job.yaml
          kubectl apply -f /tmp/train-job.yaml
      - name: Wait for training + eval gate + promotion (train.py does all three)
        run: |
          kubectl wait --for=condition=complete \
            job/fraud-training-job-${{ github.run_id }} \
            -n ${{ env.NAMESPACE }} --timeout=1200s
          # If train.py's f1 gate failed, the Job's condition is Failed, not
          # Complete - kubectl wait exits nonzero above and the workflow
          # stops here, before ever touching the serving deployment.
      - name: Show training logs
        if: always()
        run: |
          kubectl logs job/fraud-training-job-${{ github.run_id }} -n ${{ env.NAMESPACE }} || true

  restart-serving:
    runs-on: ubuntu-latest
    needs: run-training-job
    permissions:
      id-token: write
      contents: read
    steps:
      # This is the step that doesn't exist anywhere in the original
      # project. app.py loads the model once at container startup and
      # never checks again - without this, a successful promotion in
      # MLflow's registry has zero effect on what's actually being served.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ secrets.AWS_REGION }}
      - run: |
          kubectl rollout restart deployment/fraud-api-cloud -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/fraud-api-cloud -n ${{ env.NAMESPACE }} --timeout=180s
