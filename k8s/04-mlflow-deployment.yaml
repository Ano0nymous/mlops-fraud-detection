apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: mlflow
        image: 471932414173.dkr.ecr.ap-south-1.amazonaws.com/mlflow-server:latest
        imagePullPolicy: Always
        command: ["mlflow"]
        args:
          - "server"
          - "--backend-store-uri"
          - "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"
          - "--default-artifact-root"
          - "s3://$(S3_BUCKET)/$(ARTIFACT_ROOT_PREFIX)"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "5000"
        envFrom:
        - secretRef:
            name: mlflow-db-secret
        - configMapRef:
            name: mlflow-config
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
  - port: 5000
    targetPort: http
    protocol: TCP
    name: http
  type: ClusterIP
