name: App CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'k8s/06-fastapi-deployment.yaml'
      - 'k8s/08-ingress.yaml'
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: fraud-detector
  EKS_CLUSTER: fraud-cluster
  NAMESPACE: mlops

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install flake8
      - run: flake8 src/app.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: pytest tests/

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write   # required for OIDC role assumption
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for critical/high vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-scan
    environment: production   # set required reviewers under repo Settings if you want an approval gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ secrets.AWS_REGION }}
      - name: Sync the DB secret (real values live in GitHub Secrets, never in git)
        run: |
          kubectl create secret generic mlflow-db-secret \
            --from-literal=DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
            --from-literal=DB_HOST="${{ secrets.DB_HOST }}" \
            -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy new image
        run: |
          kubectl set image deployment/fraud-api-cloud \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-scan.outputs.image_tag }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/fraud-api-cloud -n ${{ env.NAMESPACE }} --timeout=180s

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ secrets.AWS_REGION }}
      - run: |
          kubectl run smoke-test-${{ github.run_id }} --rm -i --restart=Never \
            --image=curlimages/curl:8.9.1 -n ${{ env.NAMESPACE }} -- \
            curl -sf http://fraud-api-svc/health
